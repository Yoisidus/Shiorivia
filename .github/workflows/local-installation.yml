name: Local installation and build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
        id: install
      - run: node --test tests/local-installation.test.cjs
      - run: npm run build
      - run: ./node_modules/.bin/tsc --noEmit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
